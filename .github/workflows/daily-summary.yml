name: Daily Horizon Summary

on:
  # ⏸ 每日定时已暂停（省 API 费用）。恢复：去掉下面两行前面的 "# " 并 push 即可。
  # schedule:
  #   - cron: '0 19 * * *'   # 19:00 UTC = 22:00 莫斯科 = 03:00 北京
  workflow_dispatch:      # 手动触发保留可用

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写权限才能把简报推到 gh-pages 分支

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 关掉 DeepSeek 思考模式（推理 token 也按输出计费，实测占输出 77%）
          HORIZON_DISABLE_THINKING: "1"
          # 可选：把默认 GITHUB_TOKEN 给 Horizon 用，GitHub 源的速率上限 60/小时 -> 5000/小时
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # 保留历史简报
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
